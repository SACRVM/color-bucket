<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Bucket</title>

    <!-- The harness: the app alone, no desktop, F5 to develop.
         Autark (decided 2026-08-22): the app carries its own verbatim kit
         release under kit/, linked locally, no CDN. kit/VERSION names it.
         Upgrading is "delete kit/, unzip the new release" — never edit
         anything under kit/ (one owner-approved exception is recorded in
         CLAUDE.md, and the next release removes the need for it).
         This governs STANDALONE only: opened by a desktop, the app runs
         against the DESKTOP's kit, because sac.apps injects app.js into the
         desktop's own page and this file is never loaded. Keep the two on the
         same version and that difference never bites. -->
    <link rel="stylesheet" href="kit/css/ui.css">
    <script defer src="kit/js/all.js"></script>

    <script defer>
        // The app is injected AFTER the kit — exactly what a desktop does
        // before it opens you. (all.js injects its scripts, and injected
        // scripts do not hold up DOMContentLoaded, so a plain
        // <script defer src="app.js"> would run too early and find no sac.)
        function loadApp() {
            const s = document.createElement("script");
            s.src = "app.js";
            document.head.appendChild(s);
        }
        if (window.sacReady) loadApp();
        else document.addEventListener("sac:ready", loadApp, { once: true });
    </script>
</head>
<body class="app-page">
    <!-- No fake desktop frame: the app is COMPLETE and draws its own chrome —
         ribbon, toolbar, sidebar and result plane all live in app.js. They have
         to: a desktop injects app.js into ITS page and never loads this file,
         so anything parked here would simply not exist once installed.
         With no host calling mount(), sac.app.Element mounts the app itself;
         context.host is null, so its nav shows no jump-home. -->
    <app-color-bucket></app-color-bucket>
</body>
</html>
